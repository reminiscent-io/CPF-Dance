name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Installing on Replit writes resolved URLs on its internal mirror into
      # the lockfile, and this runner can't reach that host. The integrity
      # hashes still pin the exact tarballs.
      - run: sed -i 's#http://package-firewall.replit.internal/npm/#https://registry.npmjs.org/#g' package-lock.json

      - run: npm ci

      # Errors fail the build. The tree is warning-free as of this commit, so
      # --max-warnings=0 keeps it that way; relax it rather than delete it if a
      # deliberate warning is ever introduced.
      - run: npx eslint . --max-warnings=0

  types:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Installing on Replit writes resolved URLs on its internal mirror into
      # the lockfile, and this runner can't reach that host. The integrity
      # hashes still pin the exact tarballs.
      - run: sed -i 's#http://package-firewall.replit.internal/npm/#https://registry.npmjs.org/#g' package-lock.json

      - run: npm ci

      # lib/version.ts is generated and gitignored; app/api/version imports it.
      # `npm run dev` and `npm run build` generate it via their pre* hooks, but
      # tsc has no such hook.
      - run: node scripts/generate-version.mjs

      # next.config.ts sets typescript.ignoreBuildErrors, so `next build` does
      # not typecheck. This job is the only thing that does.
      - run: npx tsc --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Installing on Replit writes resolved URLs on its internal mirror into
      # the lockfile, and this runner can't reach that host. The integrity
      # hashes still pin the exact tarballs.
      - run: sed -i 's#http://package-firewall.replit.internal/npm/#https://registry.npmjs.org/#g' package-lock.json

      - run: npm ci

      - run: npm run test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Installing on Replit writes resolved URLs on its internal mirror into
      # the lockfile, and this runner can't reach that host. The integrity
      # hashes still pin the exact tarballs.
      - run: sed -i 's#http://package-firewall.replit.internal/npm/#https://registry.npmjs.org/#g' package-lock.json

      - run: npm ci

      # Catches what the others cannot: prerender failures such as a
      # useSearchParams() call with no Suspense boundary above it.
      #
      # Placeholders only. Nothing here reaches a real service — the build just
      # needs these present, because route modules construct their Supabase and
      # Stripe clients at import time while page data is collected.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder

  schema:
    name: Schema file applies
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # Builds supabase-schema.sql in an empty database. It catches a schema
      # file that no longer applies; drift from production still needs
      # fingerprint.sql run in the Supabase SQL editor.
      - run: scripts/schema-check/run.sh
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
